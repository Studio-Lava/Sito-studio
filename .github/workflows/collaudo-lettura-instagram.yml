name: Collaudo aggiornamento e pagine Studio Lava

on:
  push:
    branches: [codex/collaudo-lettura-news]

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r strumenti/requirements.txt
      - name: Riparte da un archivio precedente all’ultima uscita
        env:
          PYTHONPATH: strumenti
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from sincronizza_news_anteprima import read_feed, feed_text

          path = Path("site/news-feed.js")
          feed = read_feed(path)
          assert len(feed) >= 3
          Path("ultimo-post-atteso.txt").write_text(feed[0]["post"], encoding="utf-8")
          path.write_text(feed_text(feed[1:]), encoding="utf-8")
          PY
      - name: Importa da Meta e rigenera entrambe le pagine
        env:
          STUDIO_IG_ACCOUNT_ID: ${{ vars.STUDIO_IG_ACCOUNT_ID }}
          STUDIO_IG_TOKEN: ${{ secrets.STUDIO_IG_TOKEN }}
        run: python strumenti/prepara_rilascio_studiolava.py --sincronizza graph.facebook.com --sito site
      - name: Verifica copertina, link e integrità delle slide
        env:
          PYTHONPATH: strumenti
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import html, etree
          from PIL import Image
          from sincronizza_news_anteprima import read_feed, shortcode

          site = Path("site")
          expected = shortcode(Path("ultimo-post-atteso.txt").read_text(encoding="utf-8"))
          feed = read_feed(site / "news-feed.js")
          latest = feed[0]
          assert sum(shortcode(a["post"]) == expected for a in feed) == 1
          assert shortcode(latest["post"]) == expected or latest["date"] >= "2026-11-17"
          assert latest["key"].startswith("ig-")
          for slide in latest["slides"]:
              with Image.open(site / slide["src"]) as image:
                  image.verify()

          home = html.parse(site / "index.html")
          archive = html.parse(site / "news.html")
          assert home.xpath('string(//article[@class="home-lead"]//h3/a/@href)') == "news.html#" + latest["key"]
          assert archive.xpath('string(//article[@class="feature"]/@id)') == latest["key"]
          assert archive.xpath('string(//article[@class="feature"]//img/@src)') == latest["slides"][0]["src"]
          assert archive.xpath('string(//article[@class="feature"]//a[@class="link-action"]/@href)') == latest["post"]
          assert all(not html.parse(p).xpath('//meta[@name="robots" and contains(@content,"noindex")]')
                     for p in site.glob("*.html"))
          sitemap = etree.parse(site / "sitemap.xml")
          assert len(sitemap.getroot()) == len(list(site.glob("*.html")))
          print("Metadati e nuove pagine verificati. Tutte le " + str(len(latest["slides"])) + " slide sono integre.")
          PY
      - name: Ripeti l’aggiornamento e verifica che non ci siano duplicati
        env:
          STUDIO_IG_ACCOUNT_ID: ${{ vars.STUDIO_IG_ACCOUNT_ID }}
          STUDIO_IG_TOKEN: ${{ secrets.STUDIO_IG_TOKEN }}
        shell: bash
        run: |
          sha256sum site/index.html site/news.html site/news-feed.js > "$RUNNER_TEMP/studio-prima"
          python strumenti/prepara_rilascio_studiolava.py --sincronizza graph.facebook.com --sito site
          sha256sum --check "$RUNNER_TEMP/studio-prima"
